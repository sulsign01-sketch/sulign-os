<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sul Sign — Calculadora Impressão 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM%20Mono:wght@400;500&family=DM%20Sans:wght@400;500;600&display=swap');
:root{--black:#0f0f0f;--green:#2d6a4f;--gl:#40916c;--ga:#52b788;--g100:#f5f5f5;--g200:#e8e8e8;--g400:#9e9e9e;--g600:#5a5a5a;--ylw:#fff8e1;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',-apple-system,Helvetica,Arial,sans-serif;background:var(--g100);color:var(--black);font-size:13px;line-height:1.5;padding-bottom:78px}
.page{max-width:1020px;margin:16px auto;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.08)}
.hd-top{background:#000;display:flex;justify-content:space-between;align-items:stretch}
.hd-brand{padding:8px 16px;border-right:1px solid #2a2a2a;display:flex;align-items:center}
.hd-brand img{height:30px;width:auto;display:block}
.hd-mid{flex:1;padding:8px 16px;display:flex;flex-direction:column;justify-content:center}
.hd-mid .tipo{white-space:nowrap;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g400);margin-bottom:1px}
.hd-mid .num{white-space:nowrap;font-size:13px;font-weight:600;font-family:'DM Mono',monospace;color:#fff}
.hd-right{padding:8px 14px;display:flex;align-items:center;gap:6px}
.hb{background:transparent;color:#fff;border:1px solid #444;border-radius:3px;padding:5px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit}
.hb:hover{border-color:var(--ga);color:var(--ga)}
.hd-info{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--g200)}
.hd-info div{padding:6px 16px;border-right:1px solid var(--g200);font-size:12px;font-weight:500}
.hd-info div span{display:block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);font-weight:400}
.wrap{padding:14px 16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{flex:1 1 auto;padding:9px 6px;border:1px solid var(--g200);background:#fff;border-radius:3px;font-size:11px;font-weight:600;color:var(--g600);cursor:pointer;font-family:inherit}
.steps button.on{background:var(--green);color:#fff;border-color:var(--green)}
.card{background:#fff;border:1px solid var(--g200);border-radius:3px;padding:12px;margin-bottom:12px}
.card h2{font-size:10px;margin:0 0 10px;text-transform:uppercase;letter-spacing:2px;color:var(--green);font-weight:600;padding-bottom:4px;border-bottom:1.5px solid var(--ga);display:inline-block}
.card.peca{border-left:3px solid var(--ga)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{display:block;font-size:10px;color:var(--g600);margin-bottom:2px;font-weight:600;letter-spacing:.3px}
input[type=text]{width:100%;padding:8px;border:1px solid var(--g200);border-radius:3px;font-size:13px;background:#fff;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--green)}
input.warn{background:var(--ylw);border-color:#ffc107}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tg button{flex:1 1 auto;padding:9px 8px;border:1px solid var(--g200);background:#fff;border-radius:3px;font-size:12px;font-weight:600;color:var(--g600);cursor:pointer;font-family:inherit}
.tg button:hover{border-color:var(--ga);color:var(--green)}
.tg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.tg.chips button{flex:0 1 auto;text-align:left;font-size:11.5px;padding:7px 10px}
.tg.chips button small{display:block;font-weight:400;opacity:.75;font-size:10px;font-family:'DM Mono',monospace}
.lbl{font-size:9px;color:var(--green);font-weight:600;margin:10px 0 5px;letter-spacing:1.5px;text-transform:uppercase}
.btn{background:var(--green);color:#fff;border:0;border-radius:3px;padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.y{background:var(--ga);color:var(--black)}
.btn.g{background:var(--g200);color:var(--black)}
.btn.r{background:#fff;color:var(--red);border:1px solid var(--red);padding:6px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.line{display:grid;grid-template-columns:2fr 70px 60px 90px 90px 34px;gap:6px;align-items:center;margin-bottom:6px}
.line.mo{grid-template-columns:2fr 60px 90px 90px 90px 34px}
.line.h{font-size:9px;color:var(--g400);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{background:var(--g100);border-left:3px solid var(--ga);border-radius:3px;padding:10px;font-size:9px;text-transform:uppercase;color:var(--g600);letter-spacing:1px}
.kpi b{display:block;font-size:16px;color:var(--black);text-transform:none;letter-spacing:0;margin-top:2px;font-family:'DM Mono',monospace;font-weight:500}
.kpi div.gold{border-left-color:var(--green);background:#f0f7f4}
.kpi div.gold b{font-size:20px;color:var(--green);font-weight:600}
.out{background:var(--g100);border-radius:3px;padding:8px;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:11px;color:var(--g600)}
.out b{display:block;font-size:13px;color:var(--black);font-family:'DM Mono',monospace;font-weight:500}
.note{font-size:11px;color:var(--g600);margin-top:6px;line-height:1.5}
.alert{color:var(--red);font-weight:600;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--g400);padding:6px 4px;border-bottom:1px solid var(--g200)}
td{padding:6px 4px;border-bottom:1px solid #f0f0ee}
td.n,th.n{text-align:right;font-family:'DM Mono',monospace}
tr.sel td{color:var(--green);font-weight:600}
.folha h3{font-size:10px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:2px;background:var(--black);color:#fff;padding:6px 10px;display:flex;justify-content:space-between;font-weight:600}
.folha h3 span:last-child{font-family:'DM Mono',monospace;color:var(--ga)}
.folha .geral{background:var(--green);color:#fff;font-weight:600;padding:10px 12px;display:flex;justify-content:space-between;margin-top:12px;font-size:14px;font-family:'DM Mono',monospace}
details{margin-bottom:10px}
details>summary{cursor:pointer;font-weight:600;font-size:12px;padding:8px 0;color:var(--green)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--black);color:#fff;padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:10;border-top:2px solid var(--ga)}
.bar small{color:var(--g400);font-size:9px;display:block;letter-spacing:1.5px;text-transform:uppercase}
.bar b{font-size:19px;color:#fff;font-family:'DM Mono',monospace;font-weight:500}
.bar .btn{background:var(--green)}
.bar .btn.g{background:#2a2a2a;color:#fff}
.lay{border:1px dashed var(--ga);border-radius:3px;padding:10px;margin-top:10px;background:#fafdfb}
.lay .pv{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}
.lay .pv img{max-width:100%;max-height:170px;border:1px solid var(--g200);background:#fff;object-fit:contain}
.lay input[type=file]{display:none}
.lay .meta{font-size:11px;color:var(--g600);line-height:1.6}
.cd-lay{margin-top:6px;page-break-inside:avoid}
.cd-lay div{font-size:11px;font-weight:600;margin:8px 0 4px}
.cd-lay img{max-width:100%;max-height:300px;object-fit:contain;border:1px solid var(--g200)}
#clienteDoc{display:none;padding:18px 16px 24px}
.cd-t{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--green);font-weight:600}
.cd-n{font-size:20px;font-weight:600;margin:2px 0 12px}
.cd-m{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--g200);margin-bottom:6px}
.cd-m div{padding:7px 12px;border-bottom:1px solid var(--g200);border-right:1px solid var(--g200);font-size:12px}
.cd-m span{display:block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
.cd-s{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:600;border-bottom:1.5px solid var(--ga);padding-bottom:4px;margin:18px 0 8px}
.cd-inv{background:#f0f7f4;border:1px solid var(--ga);border-left:4px solid var(--green);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cd-inv span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--green);font-weight:600}
.cd-inv b{font-size:22px;color:var(--green);font-family:'DM Mono',monospace;font-weight:600}
.cd-f{margin-top:26px;border-top:1px solid var(--g200);padding-top:8px;font-size:9px;color:var(--g600);font-family:'DM Mono',monospace}
@media print{body.printcliente .wrap,body.printcliente .hd-info,body.printcliente .hd-mid{display:none!important}body.printcliente #clienteDoc{display:block!important}.cd-inv,.cd-m{-webkit-print-color-adjust:exact;print-color-adjust:exact}.steps,.bar,.nonprint,.hd-right{display:none!important}body{background:#fff;padding:0}.page{margin:0;box-shadow:none}body.printfolha .stepbody>*:not(#folhaWrap){display:none!important}.hd-top{-webkit-print-color-adjust:exact;print-color-adjust:exact}.folha h3,.folha .geral{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:640px){.hd-brand{padding:6px 10px}.hd-mid{padding:6px 10px}.hd-right{padding:6px 8px;flex-direction:column;gap:3px}.hb{padding:3px 7px}.line{grid-template-columns:1fr 56px 50px 76px 76px 30px}.line.mo{grid-template-columns:1fr 50px 76px 76px 76px 30px}.page{margin:0}.hd-brand img{height:24px}}
</style>
</head>

 var n=parseFloat(s);return isFinite(n)?n:0;
}

function calc(){
 var c=S.cfg,perda=1+num(c.perda)/100,i,j,r={pecas:[],mo:0,terc:0,matc:0,transp:0,cFil:0,cMaq:0,cPos:0};
 for(i=0;i<S.pecas.length;i++){
  var p=S.pecas[i],q=num(p.qtd),o={pesoTot:0,horas:0,cFil:0,cMaq:0,cPos:0,mod:0,msg:''};
  if(p.modo==='consumo'){
   o.pesoTot=num(p.peso)*q*perda;
   o.horas=num(p.tempo)*q*perda;
   o.cFil=o.pesoTot/1000*num(filById(p.fil).rkg);
   o.cMaq=o.horas*num(c.horaMaq);
  }
  for(j=0;j<p.pos.length;j++){if(p.pos[j].on){o.cPos+=num(p.pos[j].qtd)*num(p.pos[j].custo);}}
  var L=num(p.L),A=num(p.A),P=num(p.P);
  if(L>0&&A>0&&num(c.bedX)>0&&num(c.bedY)>0){
   o.mod=Math.ceil(L/num(c.bedX))*Math.ceil(A/num(c.bedY));
   if(P>0&&num(c.bedZ)>0){o.mod=o.mod*Math.ceil(P/num(c.bedZ));}
   o.msg=o.mod+' módulo'+(o.mod>1?'s':'')+' por peça (mesa '+c.bedX+'×'+c.bedY+')';
  }
  o.custo=o.cFil+o.cMaq+o.cPos;
  r.cFil+=o.cFil;r.cMaq+=o.cMaq;r.cPos+=o.cPos;
  r.pecas.push(o);
 }
 for(i=0;i<S.mats.length;i++){r.matc+=num(S.mats[i].qtd)*num(S.mats[i].custo);}
 for(i=0;i<S.mo.length;i++){r.mo+=num(S.mo[i].dias)*num(S.mo[i].diaria)+num(S.mo[i].desp);}
 for(i=0;i<S.terc.length;i++){r.terc+=num(S.terc[i].qtd)*num(S.terc[i].custo);}
 for(i=0;i<S.transp.length;i++){r.transp+=num(S.transp[i].qtd)*num(S.transp[i].custo);}
 r.b03=r.matc+r.cFil;
 r.b05=r.cMaq+r.cPos;
 r.custo=r.mo+r.terc+r.b03+r.transp+r.b05;
 return r;
}
function calcTab(t,c){
 if(t.tipo==='custo'){return {fator:1,venda:c,nf:0,total:c};}
 var den=1-(num(t.l)+num(t.imp))/100;if(den<0.01)den=0.01;
 var fator=(1+(num(t.ac)+num(t.df)+num(t.ri))/100)/den;
 var venda=c*fator,nf=venda*num(t.nf)/100;
 return {fator:fator,venda:venda,nf:nf,total:venda+nf};
}

function svgMedidas(txt){
 var out={w:0,h:0,un:'',aviso:''};
 try{
  var d=new DOMParser().parseFromString(txt,'image/svg+xml'),s=d.documentElement;
  if(!s||s.nodeName.toLowerCase()!=='svg'||d.getElementsByTagName('parsererror').length){return null;}
  var f={mm:1,cm:10,in:25.4,pt:25.4/72,pc:25.4/6,px:25.4/96,'':25.4/96};
  function lerDim(v){
   if(!v)return null;
   var m=String(v).trim().match(/^([0-9]*\.?[0-9]+)\s*(mm|cm|in|pt|pc|px)?$/i);
   if(!m)return null;
   return {n:parseFloat(m[1]),u:(m[2]||'').toLowerCase()};
  }
  var W=lerDim(s.getAttribute('width')),H=lerDim(s.getAttribute('height'));
  if(W&&H){
   out.w=W.n*f[W.u];out.h=H.n*f[H.u];out.un=W.u||'px';
   if(!W.u){out.aviso='Arquivo sem unidade: assumi px (96 dpi). Confira a medida.';}
  }else{
   var vb=(s.getAttribute('viewBox')||'').trim().split(/[\s,]+/);
   if(vb.length===4&&parseFloat(vb[2])>0){out.w=parseFloat(vb[2])*f.px;out.h=parseFloat(vb[3])*f.px;out.un='viewBox';out.aviso='Sem medida real no arquivo: estimei pelo viewBox. Confira.';}
  }
 }catch(e){return null;}
 return out;
}
function lerLayout(i,file){
 var err=document.getElementById('layerr_'+i);
 function erro(m){if(err){err.textContent=m;}}
 if(!file)return;
 if(file.size>6*1024*1024){erro('Arquivo acima de 6 MB. Exporte o SVG simplificado ou reduza a imagem.');return;}
 var ehSvg=/svg/i.test(file.type)||/\.svg$/i.test(file.name);
 var fr=new FileReader();
 fr.onerror=function(){erro('Não consegui ler o arquivo.');};
 if(ehSvg){
  fr.onload=function(){
   var txt=String(fr.result),med=svgMedidas(txt);
   if(!med){erro('Esse arquivo não parece um SVG válido.');return;}
   var data='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(txt)));
   S.pecas[i].layout={nome:file.name,data:data,w:med.w,h:med.h,un:med.un,aviso:med.aviso,mostrar:true,tam:file.size};
   salvarLayout();render();
  };
  fr.readAsText(file);
 }else{
  fr.onload=function(){
   S.pecas[i].layout={nome:file.name,data:String(fr.result),w:0,h:0,un:'',aviso:'',mostrar:true,tam:file.size};
   salvarLayout();render();
  };
  fr.readAsDataURL(file);
 }
}

  '<div class="note">fator = (1+AC+DF+RI)/(1−Lucro−Impostos); venda = custo × fator; NF entra por fora. B2C está provisório com o BDI do Futsal final.</div></details>';
 h+='<div class="card" id="folhaWrap"><div class="row nonprint" style="margin:0 0 8px"><button class="btn g" data-a="copy">Copiar resumo</button><span class="note" style="margin:0">Folha interna: não enviar ao cliente</span></div><div class="folha" id="folha"></div></div>';
 return h;
}

function render(topo){
 var y0=0;try{y0=window.pageYOffset||0;}catch(e){}
 var i,h='';
 for(i=0;i<STEPS.length;i++){h+='<button class="'+((i+1)===S.step?'on':'')+'" data-a="step" data-v="'+(i+1)+'">'+STEPS[i]+'</button>';}
 document.getElementById('steps').innerHTML=h;
 var b=S.step===1?stepJob():(S.step===2?stepPecas():(S.step===3?stepMats():(S.step===4?stepEquipe():stepPreco())));
 document.getElementById('body').innerHTML=b;
 document.getElementById('bar').innerHTML='<div><small id="bar_lbl"></small><b id="bar_tot"></b></div><div class="row" style="margin:0">'+
  (S.step>1?'<button class="btn g" data-a="step" data-v="'+(S.step-1)+'">‹ Voltar</button>':'')+
  (S.step<5?'<button class="btn" data-a="step" data-v="'+(S.step+1)+'">Avançar ›</button>':'')+'<button class="btn y" data-a="printCliente" title="PDF para o cliente">🖨 PDF</button></div>';
 recalc();
 try{window.scrollTo(0,topo?0:y0);}catch(e){}
}
function setT(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}

function tbl(titulo,total,heads,rows){
 var h='<h3><span>'+titulo+'</span><span>'+fmt(total)+'</span></h3>',i,j;
 if(!rows.length){return h+'<table><tr><td style="color:#999">—</td></tr></table>';}
 h+='<table><tr>';
 for(j=0;j<heads.length;j++){h+='<th'+(j>=heads.length-2?' class="n"':'')+'>'+heads[j]+'</th>';}
 h+='</tr>';
 for(i=0;i<rows.length;i++){
  h+='<tr>';
  for(j=0;j<rows[i].length;j++){h+='<td'+(j>=rows[i].length-2?' class="n"':'')+'>'+esc(rows[i][j])+'</td>';}
  h+='</tr>';
 }
 return h+'</table>';
}

 var h='',i,rows;
 h+='<div style="font-size:9px;letter-spacing:2px;color:#c62828;font-weight:600;margin-bottom:6px">DOCUMENTO INTERNO · NÃO ENVIAR AO CLIENTE</div><div style="font-size:12px;line-height:1.7"><b>PROJETO:</b> '+esc(S.job.projeto)+' &nbsp; <b>CLIENTE:</b> '+esc(S.job.cliente)+'<br><b>ENDEREÇO:</b> '+esc(S.job.endereco)+' &nbsp; <b>PEDIDO:</b> '+esc(S.job.pedido)+' &nbsp; <b>ENTREGA:</b> '+esc(S.job.entrega)+'</div>';
 rows=[];for(i=0;i<S.mo.length;i++){var m=S.mo[i];rows.push([String(i+1),m.nome,fmtn(num(m.dias),1)+' dia(s)',fmt(num(m.diaria))+'/dia'+(num(m.desp)?' + '+fmt(num(m.desp)):''),fmt(num(m.dias)*num(m.diaria)+num(m.desp))]);}
 h+=tbl('01 Mão de obra direta',r.mo,['ID','Descrição','Dias','Diária','Total'],rows);
 rows=[];for(i=0;i<S.terc.length;i++){var t=S.terc[i];rows.push([String(i+1),t.desc,fmtn(num(t.qtd),2)+' '+t.un,fmt(num(t.custo)),fmt(num(t.qtd)*num(t.custo))]);}
 h+=tbl('02 Terceiros',r.terc,['ID','Descrição','Qtd','Custo un.','Total'],rows);
 rows=[];
 for(i=0;i<S.pecas.length;i++){if(r.pecas[i].cFil>0){rows.push(['F'+(i+1),'Filamento '+filById(S.pecas[i].fil).marca+' '+filById(S.pecas[i].fil).cor+' ('+S.pecas[i].nome+')',fmtn(r.pecas[i].pesoTot,0)+' g',fmt(num(filById(S.pecas[i].fil).rkg))+'/kg',fmt(r.pecas[i].cFil)]);}}
 for(i=0;i<S.mats.length;i++){var q=S.mats[i];rows.push([String(i+1),q.desc,fmtn(num(q.qtd),2)+' '+q.un,fmt(num(q.custo)),fmt(num(q.qtd)*num(q.custo))]);}
 h+=tbl('03 Matéria prima',r.b03,['ID','Descrição','Qtd','Custo un.','Total'],rows);
 rows=[];for(i=0;i<S.transp.length;i++){var u=S.transp[i];rows.push([String(i+1),u.desc,fmtn(num(u.qtd),2)+' '+u.un,fmt(num(u.custo)),fmt(num(u.qtd)*num(u.custo))]);}
 h+=tbl('04 Transporte',r.transp,['ID','Descrição','Qtd','Custo un.','Total'],rows);
 rows=[];
 for(i=0;i<S.pecas.length;i++){
  var p=S.pecas[i];
  rows.push([String(i+1),(p.nome||'Peça')+(p.obs?' - '+p.obs:''),String(num(p.qtd)),'máq. '+fmt(r.pecas[i].cMaq)+' + pós '+fmt(r.pecas[i].cPos),fmt(r.pecas[i].cMaq+r.pecas[i].cPos)]);
 }
 h+=tbl('05 Produção (máquina e pós-processos)',r.b05,['ID','Descrição','Qtd','Composição','Total'],rows);
 h+='<div class="geral"><span>TOTAL GERAL (custo)</span><span>'+fmt(r.custo)+'</span></div>';
 return h;
}

function especPeca(p){
 var a=[],j;
 if(p.modo==='consumo'){var f=filById(p.fil);a.push('Impressão 3D em '+p.mat+(f.cor&&f.cor!=='Padrão'?' ('+f.cor+')':''));}
 if(p.obs){a.push(p.obs);}
 for(j=0;j<p.pos.length;j++){if(p.pos[j].on){a.push(posNome(p.pos[j].k).nome.toLowerCase());}}
 return a.join(' · ');
}
function clienteHTML(r){
 var t=tabById(S.sel),ts=calcTab(t,r.custo),i,h,hoje=new Date().toLocaleDateString('pt-BR');
 var val=S.job.validade!=null?S.job.validade:'15 dias corridos';
 var meta=[['Data',hoje],['Validade da proposta',val],['Cliente',S.job.cliente],['Projeto',S.job.projeto],['Local',S.job.endereco],['Prazo de entrega',S.job.entrega]],m='';
 for(i=0;i<meta.length;i++){if(meta[i][1]){m+='<div><span>'+meta[i][0]+'</span>'+esc(meta[i][1])+'</div>';}}
 h='<div class="cd-t">Proposta comercial</div><div class="cd-n">'+esc(S.job.numero||S.job.projeto||'Impressão 3D')+'</div><div class="cd-m">'+m+'</div>';
 h+='<div class="cd-s">Escopo</div><table><tr><th>#</th><th>Descrição</th><th>Especificação</th><th class="n">Qtd</th></tr>';
 for(i=0;i<S.pecas.length;i++){
  var p=S.pecas[i];
  h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.nome||'Peça')+'</td><td>'+esc(especPeca(p))+'</td><td class="n">'+fmtn(num(p.qtd),num(p.qtd)%1?2:0)+'</td></tr>';
 }
 h+='</table>';
 var lays='';
 for(i=0;i<S.pecas.length;i++){var Ly=S.pecas[i].layout;if(Ly&&Ly.data&&Ly.mostrar!==false){lays+='<div class="cd-lay"><div>'+esc(S.pecas[i].nome||'Peça '+(i+1))+'</div><img src="'+Ly.data+'" alt="layout"></div>';}}
 if(lays){h+='<div class="cd-s">Layout</div>'+lays;}
 h+='<div class="cd-s">Investimento</div><div class="cd-inv"><span>Valor total</span><b>'+fmt(ts.total)+'</b></div>';
 if(S.job.condicoes){h+='<div class="cd-s">Condições comerciais</div><div style="font-size:12px">'+esc(S.job.condicoes)+'</div>';}
 h+='<div class="cd-f">Sul Sign Group · CNPJ 03.952.317/0001-16 · sulsign01@gmail.com</div>';
 return h;
}
function imprimir(modo){
 var fim=function(){document.body.className='';var c=document.getElementById('clienteDoc');if(c)c.innerHTML='';};
 if(modo==='cliente'){
  var t=tabById(S.sel);
  if(t.tipo==='custo'&&!confirm('A tabela selecionada é "'+t.nome+'" (sem margem). O cliente veria o valor de custo. Gerar mesmo assim?')){return;}
  document.getElementById('clienteDoc').innerHTML=clienteHTML(calc());
  document.body.className='printcliente';
 }else{
  document.body.className='printfolha';
 }
 window.onafterprint=fim;
 try{window.print();}catch(e){}
 setTimeout(fim,8000);
}
function recalc(){
 var r=calc(),i,j,tsel=tabById(S.sel),ts=calcTab(tsel,r.custo);
 for(i=0;i<S.pecas.length;i++){
  var o=r.pecas[i];
  setT('pp_'+i,fmtn(o.pesoTot,0)+' g');setT('ph_'+i,fmtn(o.horas,1)+' h');
  setT('pf_'+i,fmt(o.cFil));setT('pm_'+i,fmt(o.cMaq));setT('px_'+i,fmt(o.cPos));setT('mod_'+i,o.msg);
 }
 for(i=0;i<S.mats.length;i++){setT('mt_'+i,fmt(num(S.mats[i].qtd)*num(S.mats[i].custo)));}
 for(i=0;i<S.mo.length;i++){setT('mo_'+i,fmt(num(S.mo[i].dias)*num(S.mo[i].diaria)+num(S.mo[i].desp)));}
 var ks=['terc','transp'];
 for(j=0;j<ks.length;j++){for(i=0;i<S[ks[j]].length;i++){setT(ks[j]+'_'+i,fmt(num(S[ks[j]][i].qtd)*num(S[ks[j]][i].custo)));}}
 setT('bar_lbl','Total · '+tsel.nome);setT('bar_tot',fmt(ts.total));
 setT('k_custo',fmt(r.custo));setT('k_venda',fmt(ts.venda));setT('k_nf',fmt(ts.nf));setT('k_total',fmt(ts.total));
 setT('k_fator','Fator '+fmtn(ts.fator,6)+(tsel.tipo==='bdi'?' · multiplicador c/ NF '+fmtn(ts.fator*(1+num(tsel.nf)/100),4):''));
 for(i=0;i<S.tabs.length;i++){
  var t=S.tabs[i],c=calcTab(t,r.custo);
  setT('cv_'+t.id,fmt(c.venda));setT('ct_'+t.id,fmt(c.total));
  var row=document.getElementById('cr_'+t.id);if(row)row.className=(t.id===S.sel?'sel':'');
 }
 var fo=document.getElementById('folha');if(fo)fo.innerHTML=folhaHTML(r);
 var hi=document.getElementById('hdinfo');
 if(hi){
  var it=[['Nº',S.job.numero],['Cliente',S.job.cliente],['Projeto',S.job.projeto],['Entrega',S.job.entrega]],hh='',q;
  for(q=0;q<it.length;q++){if(it[q][1]){hh+='<div><span>'+it[q][0]+'</span>'+esc(it[q][1])+'</div>';}}
  hi.innerHTML=hh;
 }
}

function setPath(path,v){
 var parts=path.split('.'),o=S,i;
 for(i=0;i<parts.length-1;i++){o=o[parts[i]];if(o==null)return;}
 o[parts[parts.length-1]]=v;
}
document.addEventListener('change',function(e){
 var fe=e.target;
 if(fe&&fe.type==='file'&&fe.dataset&&fe.dataset.layout!=null){
  var fl=fe.files&&fe.files[0];
  lerLayout(num(fe.dataset.layout),fl);
  try{fe.value='';}catch(x){}
 }
});
document.addEventListener('input',function(e){
 var el=e.target;
 if(!el.dataset||!el.dataset.p)return;
 setPath(el.dataset.p,el.dataset.t==='s'?el.value:num(el.value));
 save();recalc();
});

function resumo(){
 var r=calc(),tsel=tabById(S.sel),ts=calcTab(tsel,r.custo),L=[];
 L.push('FOLHA DE CUSTO — '+(S.job.projeto||'s/ projeto')+' · '+(S.job.cliente||''));
 L.push('01 MO: '+fmt(r.mo)+' | 02 Terceiros: '+fmt(r.terc)+' | 03 Matéria prima: '+fmt(r.b03)+' | 04 Transporte: '+fmt(r.transp)+' | 05 Produção: '+fmt(r.b05));
 L.push('TOTAL GERAL (custo): '+fmt(r.custo));
 L.push('Tabela '+tsel.nome+': venda '+fmt(ts.venda)+' | NF '+fmt(ts.nf)+' | TOTAL '+fmt(ts.total));
 return L.join('\n');
}
function copiar(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;}}catch(e){}
 var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');}catch(e2){}
 document.body.removeChild(ta);
}

document.addEventListener('click',function(e){
 var el=e.target;
 while(el&&el!==document&&!(el.dataset&&el.dataset.a)){el=el.parentNode;}
 if(!el||!el.dataset||!el.dataset.a)return;
 var a=el.dataset.a,i=num(el.dataset.i),j=num(el.dataset.j),v=el.dataset.v,k,x;
 if(a==='step'){S.step=num(v);}
 else if(a==='mat'){
  S.pecas[i].mat=v;
  for(k=0;k<S.fils.length;k++){if(S.fils[k].mat===v){S.pecas[i].fil=S.fils[k].id;break;}}
 }
 else if(a==='fil'){S.pecas[i].fil=v;}
 else if(a==='modo'){S.pecas[i].modo=v;}
 else if(a==='pos'){S.pecas[i].pos[j].on=!S.pecas[i].pos[j].on;}
 else if(a==='addPeca'){S.pecas.push(mkPeca());}
 else if(a==='dupPeca'){S.pecas.splice(i+1,0,JSON.parse(JSON.stringify(S.pecas[i])));}
 else if(a==='delPeca'){S.pecas.splice(i,1);}
 else if(a==='addMat'){x=MATP[num(v)];S.mats.push({desc:x.desc,qtd:1,un:x.un,custo:x.custo});}
 else if(a==='addMatFil'){x=filById(v);S.mats.push({desc:'Filamento '+x.marca+' '+x.cor+' ('+x.mat+')',qtd:1,un:'rolo',custo:x.rkg});}
 else if(a==='delMat'){S.mats.splice(i,1);}
 else if(a==='addMo'){x=MOP[num(v)];S.mo.push({nome:x.nome,dias:1,diaria:x.diaria,desp:0});}
 else if(a==='delMo'){S.mo.splice(i,1);}
 else if(a==='add_terc'){x=TERCP[num(v)];S.terc.push({desc:x.desc,qtd:1,un:x.un,custo:x.custo});}
 else if(a==='del_terc'){S.terc.splice(i,1);}
 else if(a==='add_transp'){x=TRP[num(v)];S.transp.push({desc:x.desc,qtd:1,un:x.un,custo:x.custo});}
 else if(a==='del_transp'){S.transp.splice(i,1);}
 else if(a==='addFil'){S.fils.push({id:uid(),mat:'PETG',marca:'Nova marca',cor:'Cor',rkg:90,fonte:'informado'});}
 else if(a==='layMostrar'){var Lm=S.pecas[i].layout;if(Lm){Lm.mostrar=(Lm.mostrar===false);}}
 else if(a==='layDel'){S.pecas[i].layout=null;}
 else if(a==='layDim'){var Ld=S.pecas[i].layout;if(Ld&&Ld.w){S.pecas[i].L=Math.round(Ld.w);S.pecas[i].A=Math.round(Ld.h);}}
 else if(a==='delFil'){if(S.fils.length>1){S.fils.splice(i,1);}}
 else if(a==='tab'){S.sel=v;}
 else if(a==='tipo'){S.tabs[i].tipo=v;}
 else if(a==='addTab'){S.tabs.push({id:uid(),nome:'Tabela personalizada',tipo:'bdi',ac:8,df:2,ri:3,l:18,imp:10,nf:12});}
 else if(a==='delTab'){if(S.tabs.length>1){var tid=S.tabs[i].id;S.tabs.splice(i,1);if(S.sel===tid){S.sel=S.tabs[0].id;}}}
 else if(a==='copy'){copiar(resumo());el.textContent='Copiado ✓';setTimeout(function(){el.textContent='Copiar resumo';},1500);return;}
 else if(a==='printFolha'){imprimir('folha');return;}
 else if(a==='printCliente'){imprimir('cliente');return;}
 else if(a==='seara'){loadSeara();}
 else if(a==='reset'){if(confirm('Zerar todo o job e voltar ao catálogo padrão?')){S=defaults();}else{return;}}
 save();render(a==='step'||a==='seara'||a==='reset');
});

window.SS3D={get:function(){return S;},calc:calc,seara:loadSeara,calcTab:calcTab,cliente:function(){return clienteHTML(calc());}};
render();
})();

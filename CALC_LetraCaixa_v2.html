<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALC Letra Caixa — Sul Sign</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{--black:#0f0f0f;--green:#2d6a4f;--gl:#40916c;--ga:#52b788;--g100:#f5f5f5;--g200:#e8e8e8;--g400:#9e9e9e;--g600:#5a5a5a;
--ink:#0f0f0f;--paper:#f5f5f5;--accent:#2d6a4f;--line:#e8e8e8;--mut:#5a5a5a;--ok-soft:#e3f5eb;--warn:#ffc107;--warn-soft:#fff8e1;--danger:#c62828;--danger-soft:#fdecea;--font-d:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--g100);color:var(--black);font-size:13px;line-height:1.5}
.page{max-width:1060px;margin:24px auto;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.08)}
.hd-top{background:var(--black);display:flex;justify-content:space-between;align-items:stretch}
.hd-brand{padding:9px 20px;border-right:1px solid #2a2a2a;display:flex;align-items:center}.hd-brand img{height:34px;display:block}
.hd-mid{flex:1;padding:9px 20px;display:flex;flex-direction:column;justify-content:center}
.t1{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:var(--g400);margin-bottom:2px}.t2{font-size:15px;font-weight:600;font-family:'DM Mono',monospace;color:#fff}
.hd-right{padding:9px 20px;text-align:right;display:flex;flex-direction:column;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--g400)}
.hd-bar{height:3px;background:var(--ga)}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--ga)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--black);color:#fff;border-radius:4px;padding:12px 14px}.kpi .lb{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}.kpi .vl{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--ga)}.kpi .dt{font-size:11px;color:var(--g400)}
.btn{background:var(--black);color:#fff;border:none;border-radius:3px;padding:8px 16px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.btn.acc{background:var(--green)}.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--black)}.btn.sm{padding:4px 10px;font-size:11px}
.lcx{padding:18px 20px!important;max-width:none!important}.lcx h2{display:none}.lcx .sub{display:none}
.lcx-f>span{font-size:9px!important;letter-spacing:1px!important}.lcx input[type=text]{background:#fffdf0;border-color:#e8dca0!important;border-radius:3px!important;font-family:'DM Mono',monospace}.lcx select{border-radius:3px!important}
.lcx-seg button.on{background:var(--green)!important}.lcx-tab.on{border-bottom-color:var(--green)!important;color:var(--black)}
.lcx-bar .btn{margin-bottom:4px}.loading-view,.err-view{padding:30px;text-align:center;color:var(--g600)}
.rod{padding:10px 20px;border-top:1px solid var(--g200);font-family:'DM Mono',monospace;font-size:9px;color:var(--g400);display:flex;justify-content:space-between}
</style></head><body>

        if(pip(o.p,px,py)) dpt++; }

    });

  /* ═════════════ encaixe nas chapas (consumo por material) ═════════════ */

    var lays={}; cts.forEach(function(c){ lays[c.L]=1; });
    Object.defineProperty(geo,'_doc',{value:doc,enumerable:false,writable:true});
    Object.defineProperty(geo,'_camadas',{value:Object.keys(lays),enumerable:false,writable:true});
    return geo;
  };
  /* sem arquivo: estimativa por texto e altura (letras de fonte cheia: largura 0,72·H, preenchimento 45%, contorno 4·H) */
  LCX.geoDeTexto=function(texto, alturaCm, qtdLetras){
    var H=num(alturaCm)/100, t=String(texto||'').replace(/\s/g,''), n=Math.max(1,Math.round(num(qtdLetras))||t.length||1);
    var larg=H*0.72;
    return {fonte:'texto', nome:texto||'letras', pecas:n, vazados:0, areaM2:H*larg*0.45*n, perimM:H*4*n, bboxMm:[larg*n*1000, H*1000],
            pecasLista:[], avisos:['Geometria ESTIMADA pela altura (preenchimento 45%). Suba o DXF/SVG para medir de verdade.']};
  };

  /* ───────────── cobrança de material por chapa ─────────────
     Entrada: lista de peças [{w,h,areaMm2}] (mm), material, qtd. Usa o encaixe do RTR quando houver. */
  function consumoChapas(mat, pecas, qtd, P, geo){
    var A=areaChapaM2(mat), env=0, liq=0, i;
    if(pecas&&pecas.length){ pecas.forEach(function(p){ env+=p.w*p.h; liq+=p.areaMm2; }); env=env/1e6*qtd; liq=liq/1e6*qtd; }
    else { env=(geo.bboxMm[0]*geo.bboxMm[1])/1e6*qtd; liq=geo.areaM2*qtd; }
    var chapasAuto=null, usadas=null;
    var R=getRTR();
    if(R&&R.consumo&&geo&&geo._doc){
      try {
        var cfg={presets:{}, maq:R.MAQ, cob:R.COB};
        var pr=null; for(i=0;i<R.PRESETS.length;i++){ if(R.PRESETS[i].id===mat.id) pr=R.PRESETS[i]; }
        if(pr){ pr=JSON.parse(JSON.stringify(pr)); pr.chapa=mat.chapa.slice(); pr.preco=mat.preco; cfg.presets[mat.id]=pr;
          var ops={}; (geo._camadas||[]).forEach(function(c){ ops[c]=mat.id; });
          var C=R.consumo([{id:'a', doc:geo._doc, qtd:qtd, ops:ops}], cfg, {modo:'usada'});
          if(C.materiais&&C.materiais[0]){ chapasAuto=C.materiais[0].chapasAuto; usadas=C.materiais[0].chapasUsadas; }
        }
      } catch(e){}
    }
    return {areaChapaM2:A, envM2:env, liqM2:liq, chapas:chapasAuto, usadas:usadas};
  }
  /* custo do material: modo consumo (área do retângulo envolvente + perda, com mínimo) ou chapas inteiras */
  function custoMaterial(mat, cons, P, minimo, modo){
    var A=cons.areaChapaM2, perda=1+num(P.perda)/100, m2=cons.envM2*perda;
    var consumo=Math.max(minimo||0, m2/A*mat.preco);
    var inteira=(cons.chapas!=null?cons.chapas:Math.max(1,Math.ceil(m2/A)))*mat.preco;
    var usadas=cons.usadas!=null?cons.usadas:m2/A;
    var modoEf=modo==='auto'?((usadas<=1.0001)?'consumo':'inteira'):modo;
    var v=modoEf==='consumo'?consumo:inteira;
    var minAplicado=modoEf==='consumo'&&consumo>m2/A*mat.preco+1e-9;
    return {valor:v, m2:m2, modo:modoEf, consumo:consumo, inteira:inteira, chapas:cons.chapas, usadas:usadas, minimo:minAplicado};
  }

  /* ───────────── cálculo principal ─────────────
     job = {
       nome, cliente, perfil, nf(bool), qtd, complexidade,
       geo (geoDeDoc/geoDeTexto), constr: 'chapada'|'caixa'|'impressao3d',
       chapada:{mat, acab:'vinil'|'pintura'|'nenhum', vinil:'fosco'|'uv'|'lam'|'recorte', cores},
       caixa:{face, lateral, fundo ('sem' ou id), prof (cm), ilum:'nenhuma'|'halo'|'frontlit'|'backlight'|'dupla', led, pintura(bool), cores},
       i3d:{peso_g, tempo_h, semPerda, fil:'petg_tr'|'petg_bo'|'pla'|'asa', paredeMm(0=auto), kg(R$/kg, 0=padrão), frente:'nenhum'|id acrílico, fundo:'nenhum'|id},
       gabarito:{on, modo:'mdf3'|'papel'}, instalacao:'cliente'|'sulsign'|'pdvex', alturaInst,
       extras:[{desc,valor,grupo}], params (override), ovr:{chave:{q,p}|valor}
     } */
  LCX.calcular=function(job){
    var P=mix(LCX.PARAMS, job.params||{});
    var perfil=mix(LCX.PERFIS[job.perfil||'sulsign']||LCX.PERFIS.sulsign, job.perfilOv||{});
    var fator=LCX.fator(perfil);
    var cx=cxDe(job.complexidade), qtd=Math.max(1,Math.round(num(job.qtd))||1);
    var geo=job.geo, linhas=[], avisos=[];
    var constr=job.constr||'chapada';
    function L(grupo,chave,desc,q,un,pu,v,nota){
      var l={grupo:grupo, chave:chave, desc:desc, qtd:q, un:un, pu:pu, custo:(v==null?r2(q*pu):v), nota:nota||''};
      var o=job.ovr&&job.ovr[chave];
      if(o!=null){
        if(typeof o==='object'){
          if(o.q!=null) l.qtd=num(o.q); if(o.p!=null) l.pu=num(o.p);
          l.custo=r2(l.qtd*l.pu); l.manual=true;
        } else { l.custo=r2(num(o)); l.manual=true; }
      }
      linhas.push(l); return l;
    }
    var pecas=Math.max(1,geo.pecas||1);
    var bboxM2=(geo.bboxMm[0]*geo.bboxMm[1])/1e6;
    var perim=geo.perimM, area=geo.areaM2;
    var materiais=[];                       /* levantamento de materiais */
    var mpTotal=0;                          /* base dos consumíveis: matéria-prima da peça */
    var corteML=0, corteGab=0, temRouter=false;
    var luz=false, ledM=0, watts=0;
    var temAcr=false;

    function matLinha(grupo, chave, rotulo, matId, pecasLst, minimo, medida){
      var mat=LCX.catalogo(matId); if(!mat){ avisos.push('Material "'+matId+'" fora do catálogo.'); return null; }
      var cons=consumoChapas(mat, pecasLst, qtd, P, geo);
      var cm=custoMaterial(mat, cons, P, minimo, P.modoMat);
      var desc=rotulo+' ('+mat.nome+')';
      var un=cm.modo==='consumo'?'m²':'chapa';
      var q=cm.modo==='consumo'?r2(cm.m2):(cm.chapas!=null?cm.chapas:Math.max(1,Math.ceil(cm.m2/areaChapaM2(mat))));
      var pu=cm.modo==='consumo'?(mat.preco/areaChapaM2(mat)):mat.preco;
      var nota=cm.modo==='consumo'?(cm.minimo?'valor mínimo R$ '+r2(minimo):'consumo + '+P.perda+'% de perda'):'chapas inteiras';
      var l=L(grupo, chave, desc, q, un, pu, cm.modo==='consumo'?r2(cm.valor):r2(cm.inteira), nota);
      materiais.push({chave:chave, material:mat.nome, fam:mat.fam, uso:rotulo, chapa:mat.chapa, precoChapa:mat.preco, envM2:cons.envM2, liqM2:cons.liqM2, m2Cobrado:cm.m2,
                      chapas:cm.chapas, usadas:cm.usadas, modo:cm.modo, custo:l.custo, nota:nota, medida:medida||''});
      return {l:l, mat:mat, cm:cm};
    }
    function minDe(mat){ return mat&&mat.fam==='PVC'?P.minPvc:(mat&&mat.fam==='Acrílico'?P.minAcr:0); }

    var pecasPrincipais=geo.pecasLista||[];
    var espMat=null;

    /* ── 1. CONSTRUÇÃO ── */
    if(constr==='chapada'){
      var cf=job.chapada||{};
      var rm=matLinha('mp','mat_face','Letra chapada', cf.mat||'pvc15', pecasPrincipais, minDe(LCX.catalogo(cf.mat||'pvc15')), Math.round(geo.bboxMm[0])+' × '+Math.round(geo.bboxMm[1])+' mm');
      if(rm){ mpTotal+=rm.l.custo; espMat=rm.mat; }
      corteML=perim*qtd; temRouter=true;
      var ac=job.soCorte?'nenhum':(cf.acab||'vinil');
      if(ac==='vinil'){
        var sg=P.vinilSangria/1000, tipo=cf.vinil||'lam';
        var m2v=Math.max(P.vinilMinM2*qtd, (geo.bboxMm[0]/1000+2*sg)*(geo.bboxMm[1]/1000+2*sg)*qtd);
        var pv=P.vinil[tipo]!=null?P.vinil[tipo]:P.vinil.lam;
        var lv=L('mp','vinil','Adesivo vinil impresso na frente ('+vinilNome(tipo)+')', r2(m2v), 'm²', pv, null, 'sangria '+P.vinilSangria+' mm · mínimo '+P.vinilMinM2+' m²');
        mpTotal+=lv.custo;
        materiais.push({chave:'vinil', material:'Vinil '+vinilNome(tipo), fam:'Vinil', uso:'Frente', chapa:null, precoChapa:pv, envM2:m2v, liqM2:area*qtd, m2Cobrado:m2v, custo:lv.custo, nota:lv.nota, medida:''});
      } else if(ac==='pintura'){
        var nc=Math.max(1,Math.round(num(cf.cores))||1), tMm=(function(){ var mm=/(\d+(?:[.,]\d+)?)\s*mm/.exec((espMat&&espMat.nome)||''); return mm?parseFloat(mm[1].replace(',','.')):0; })(), mp2=(area+perim*tMm/1000)*qtd*nc;
        var lp=L('mp','pintura','Pintura PU'+(nc>1?' ('+nc+' cores)':''), r2(mp2), 'm²', P.pintura, null, tMm?'face + laterais ('+tMm+' mm)':'');
        mpTotal+=lp.custo;
        materiais.push({chave:'pintura', material:'Pintura PU', fam:'Acabamento', uso:'Face', chapa:null, precoChapa:P.pintura, envM2:mp2, liqM2:mp2, m2Cobrado:mp2, custo:lp.custo, nota:'', medida:''});
      }
    } else if(constr==='caixa'){
      var cj=job.caixa||{}, prof=Math.max(0.5,num(cj.prof)||5)/100;
      var faceId=cj.face||'acr3', latId=cj.lateral||'pvc10', fundoId=cj.fundo==null?'pvc5':cj.fundo;
      var rf=matLinha('mp','mat_face','Face', faceId, pecasPrincipais, minDe(LCX.catalogo(faceId)), '');
      if(rf){ mpTotal+=rf.l.custo; if(rf.mat.fam==='Acrílico') temAcr=true; }
      /* lateral: faixa de perímetro × profundidade, cobrada por área (retângulo do desenvolvimento + perda) */
      var latMat=LCX.catalogo(latId);
      if(latMat){
        var areaLat=perim*prof*qtd, perda=1+num(P.perda)/100, mm2=areaLat*perda;
        var vLat=Math.max(minDe(latMat), mm2/areaChapaM2(latMat)*latMat.preco);
        var lLat=L('mp','mat_lat','Lateral ('+latMat.nome+')', r2(mm2), 'm²', latMat.preco/areaChapaM2(latMat), r2(vLat), 'perímetro × profundidade '+Math.round(prof*100)+' cm + '+P.perda+'% de perda');
        mpTotal+=lLat.custo; if(latMat.fam==='Acrílico') temAcr=true;
        materiais.push({chave:'mat_lat', material:latMat.nome, fam:latMat.fam, uso:'Lateral', chapa:latMat.chapa, precoChapa:latMat.preco, envM2:areaLat, liqM2:areaLat, m2Cobrado:mm2, chapas:null, usadas:null, modo:'consumo', custo:lLat.custo, nota:lLat.nota, medida:'faixa de '+Math.round(prof*100)+' cm'});
      }
      if(fundoId!=='sem'){
        var rfu=matLinha('mp','mat_fundo','Fundo', fundoId, pecasPrincipais, minDe(LCX.catalogo(fundoId)), '');
        if(rfu) mpTotal+=rfu.l.custo;
      }
      var nFaces=(fundoId!=='sem'?2:1);
      corteML=perim*qtd*(nFaces+num(P.latBordas)); temRouter=true;
      if(cj.vinilFace){
        var sgC=P.vinilSangria/1000, tpC=cj.vinil||'lam';
        var m2C=Math.max(P.vinilMinM2*qtd, (geo.bboxMm[0]/1000+2*sgC)*(geo.bboxMm[1]/1000+2*sgC)*qtd), pvC=P.vinil[tpC]!=null?P.vinil[tpC]:P.vinil.lam;
        var lvC=L('mp','vinil','Adesivo vinil impresso na face ('+vinilNome(tpC)+')', r2(m2C), 'm²', pvC, null, 'sangria '+P.vinilSangria+' mm · mínimo '+P.vinilMinM2+' m²');
        mpTotal+=lvC.custo;
        materiais.push({chave:'vinil', material:'Vinil '+vinilNome(tpC), fam:'Vinil', uso:'Face', chapa:null, precoChapa:pvC, envM2:m2C, liqM2:area*qtd, m2Cobrado:m2C, custo:lvC.custo, nota:lvC.nota, medida:''});
      }
      var acC=cj.pintura;
      if(acC){
        var ncc=Math.max(1,Math.round(num(cj.cores))||1), mpC=(area+perim*prof)*qtd*ncc;
        var lpc=L('mp','pintura','Pintura PU (face e lateral)'+(ncc>1?' ('+ncc+' cores)':''), r2(mpC), 'm²', P.pintura, null, '');
        mpTotal+=lpc.custo;
        materiais.push({chave:'pintura', material:'Pintura PU', fam:'Acabamento', uso:'Face e lateral', chapa:null, precoChapa:P.pintura, envM2:mpC, liqM2:mpC, m2Cobrado:mpC, custo:lpc.custo, nota:'', medida:''});
      }
      /* iluminação */
      var il=cj.ilum||'nenhuma';
      if(il!=='nenhuma'){
        luz=true;
        var tp=P.led[cj.led||'fita']||P.led.fita;
        var frente=il==='frontlit'||il==='dupla', halo=il==='halo'||il==='dupla'?true:false;
        var m=0;
        if(il==='halo') m=perim;
        else if(il==='frontlit') m=Math.max(perim, area/(P.ledEspac/1000), 0.25*pecas);
        else if(il==='backlight') m=area/Math.max(0.05,1.2*prof);
        else if(il==='dupla') m=Math.max(perim, area/(P.ledEspac/1000), 0.25*pecas)+perim;
        ledM=m*qtd;
        var lLed=L('mp','led',tp.nome+' ('+il+')', r2(ledM), 'm', tp.preco, null, 'contorno/área conforme o tipo de iluminação');
        mpTotal+=lLed.custo;
        materiais.push({chave:'led', material:tp.nome, fam:'Elétrica', uso:il, chapa:null, precoChapa:tp.preco, envM2:0, liqM2:0, m2Cobrado:0, custo:lLed.custo, nota:'', medida:r2(ledM)+' m'});
        if(tp.fonte){
          watts=ledM*tp.w*P.fonteFolga;
          var lFo=L('mp','fonte','Fonte chaveada', Math.ceil(watts), 'W', P.fonteRW, r2(Math.max(P.minFonte, watts*P.fonteRW)), 'folga '+P.fonteFolga+'× · mínimo R$ '+P.minFonte);
          mpTotal+=lFo.custo;
        }
        var lFi=L('mp','fiacao','Fiação e conectores', pecas*qtd, 'peça', P.fiacaoPeca, null, '');
        mpTotal+=lFi.custo;
      }
    } else { /* impressão 3D */
      var i3=job.i3d||{}, p3=P.p3d;
      var prof3=Math.max(0.5,num(job.caixa&&job.caixa.prof)||5)/100;
      var peso, filKey=(i3.fil==='petg'||!i3.fil)?'petg_tr':i3.fil, filNome=(p3.fils[filKey]||{nome:String(filKey).toUpperCase()}).nome, Hmm=prof3*1000;
      var maior=Hmm; (geo.pecasLista||[]).forEach(function(q){ maior=Math.max(maior,q.w||0,q.h||0); }); if(!(geo.pecasLista||[]).length) maior=Math.max(maior,geo.bboxMm[0]||0,geo.bboxMm[1]||0);
      var tpar=num(i3.paredeMm)>0?num(i3.paredeMm):LCX.paredeAuto(maior);
      if(num(i3.peso_g)>0){ peso=num(i3.peso_g)*qtd*(i3.semPerda?1:(1+p3.perda/100)); }
      else { var pu=p3.kParede*perim*Hmm*tpar + area*p3.baseMm*1000*p3.dens; peso=pu*qtd*(1+p3.perda/100); avisos.push('Peso do filamento ESTIMADO (parede '+tpar+' mm'+(num(i3.paredeMm)>0?'':' automática')+', altura '+Math.round(Hmm)+' mm): leia o G-code ou informe o peso do fatiador para o valor real.'); }
      var horas=num(i3.tempo_h)>0?num(i3.tempo_h)*qtd*(i3.semPerda?1:(1+p3.perda/100)):peso/(p3.ghora*p3.fator);
      var kg=num(i3.kg)>0?num(i3.kg):(p3.kg[filKey]||p3.kg.petg);
      var lFil=L('mp','filamento','Filamento '+filNome, r2(peso), 'g', kg/1000, null, num(i3.peso_g)>0?'peso informado'+(i3.semPerda?'':' + '+p3.perda+'% de perda'):'estimado');
      mpTotal+=lFil.custo;
      var lMq=L('eqp','maq3d','Hora de máquina 3D', r2(horas), 'h', p3.horaMaq, null, num(i3.tempo_h)>0?'tempo informado':'peso ÷ ('+p3.ghora+' g/h × '+p3.fator+')');
      mpTotal+=lMq.custo;
      materiais.push({chave:'filamento', material:'Filamento '+filNome, fam:'3D', uso:'Impressão', chapa:null, precoChapa:kg, envM2:0, liqM2:0, m2Cobrado:0, custo:lFil.custo, nota:lFil.nota, medida:r2(peso)+' g · '+r2(horas)+' h'});
      /* frente e fundo em acrílico (placa de fixação no contorno do logo) */
      var fr3=i3.frente||'nenhum', fu3=i3.fundo||'nenhum', medBb=Math.round(geo.bboxMm[0])+' × '+Math.round(geo.bboxMm[1])+' mm';
      if(fr3!=='nenhum'){ var rF=matLinha('mp','mat_face','Frente em acrílico', fr3, pecasPrincipais, minDe(LCX.catalogo(fr3)), medBb); if(rF){ mpTotal+=rF.l.custo; if(rF.mat.fam==='Acrílico') temAcr=true; corteML+=perim*qtd; temRouter=true; } }
      if(fu3!=='nenhum'){ var rU=matLinha('mp','mat_fundo','Chapa de fundo (fixação)', fu3, pecasPrincipais, minDe(LCX.catalogo(fu3)), medBb); if(rU){ mpTotal+=rU.l.custo; if(rU.mat.fam==='Acrílico') temAcr=true; corteML+=perim*qtd; temRouter=true; } }
      var ilu3=(job.caixa&&job.caixa.ilum)||'nenhuma';
      if(ilu3!=='nenhuma'){ luz=true; var tp3=P.led[(job.caixa&&job.caixa.led)||'fita']||P.led.fita; ledM=perim*qtd;
        var l3=L('mp','led',tp3.nome+' ('+ilu3+')', r2(ledM), 'm', tp3.preco, null, 'contorno'); mpTotal+=l3.custo;
        if(tp3.fonte){ watts=ledM*tp3.w*P.fonteFolga; var f3=L('mp','fonte','Fonte chaveada', Math.ceil(watts), 'W', P.fonteRW, r2(Math.max(P.minFonte, watts*P.fonteRW)), ''); mpTotal+=f3.custo; } }
    }

    /* ── 2. GABARITO DE INSTALAÇÃO ── */
    var gb=job.gabarito||{};
    if(gb.on){
      if((gb.modo||'mdf3')==='mdf3'){
        var mg=P.gabMargem/1000, gw=geo.bboxMm[0]/1000+2*mg, gh=geo.bboxMm[1]/1000+2*mg;
        var gArea=gw*gh*qtd*(1+num(P.perda)/100);
        var gPreco=P.mdf3.preco/(P.mdf3.chapa[0]*P.mdf3.chapa[1]/1e6);
        var lg=L('gab','gab_mat','Gabarito de instalação — MDF 3 mm (margem '+P.gabMargem/10+' cm, janelas no contorno)', r2(gArea), 'm²', gPreco, null, 'janelas = contorno de cada peça');
        corteGab=(perim+2*(gw+gh))*qtd; temRouter=true;
        materiais.push({chave:'gab_mat', material:'MDF cru 3 mm (gabarito)', fam:'MDF', uso:'Gabarito', chapa:P.mdf3.chapa, precoChapa:P.mdf3.preco, envM2:gw*gh*qtd, liqM2:gw*gh*qtd, m2Cobrado:gArea, custo:lg.custo, nota:lg.nota, medida:Math.round(gw*1000)+' × '+Math.round(gh*1000)+' mm'});
      } else {
        var gA2=(geo.bboxMm[0]/1000+0.1)*(geo.bboxMm[1]/1000+0.1)*qtd;
        var lg2=L('gab','gab_mat','Gabarito de instalação — impresso 1:1 com marcas de furo', r2(gA2), 'm²', P.vinil.fosco, null, 'vinil fosco');
        materiais.push({chave:'gab_mat', material:'Vinil fosco (gabarito)', fam:'Vinil', uso:'Gabarito', chapa:null, precoChapa:P.vinil.fosco, envM2:gA2, liqM2:gA2, m2Cobrado:gA2, custo:lg2.custo, nota:'', medida:''});
      }
    }

    /* ── 3. ROUTER (corte por m.l. do perfil + operador) ── */
    if(temRouter){
      var mlTotal=corteML+corteGab;
      var vendaML=num(perfil.routerML);
      var puCusto=vendaML/fator;
      L('eqp','router',(constr==='impressao3d'?'Router — corte do acrílico (frente e fundo)':'Router — corte da peça'), r2(corteML), 'm.l.', puCusto, null, 'R$ '+r2(vendaML)+'/m.l. na venda do perfil');
      if(corteGab>0) L('eqp','router_gab','Router — corte do gabarito', r2(corteGab), 'm.l.', puCusto, null, 'janelas + perímetro externo');
      var jobsRouter=1+(corteGab>0?1:0);
      var minOp=(P.opSetupMin*jobsRouter+P.opMinPorM*mlTotal);
      var horasOp=Math.max(P.opMinHoras, minOp/60);
      L('mo','mo_router','M.O. operador de router', r2(horasOp), 'h', P.horaOperador, null, Math.round(minOp)+' min calculados · mínimo '+P.opMinHoras+' h');
    }

    /* só corte: material + router + operador + arte-final; sem fixação, consumíveis, montagem, acabamento nem embalagem */
    var soCorte=!!job.soCorte&&constr==='chapada';

    /* ── 4. FIXAÇÃO ── */
    if(constr!=='impressao3d'&&!soCorte){

    if(inst==='sulsign'){

    }

    /* ── 9. EXTRAS DO USUÁRIO ── */

    var custo=0; linhas.forEach(function(l){ custo+=l.custo; });
    custo=r2(custo);
    var venda=r2(custo*fator);

    var vendaNF=r2(venda*(1+nfPct/100));
    var out={job:job, perfil:perfil, fator:fator, cx:cx, qtd:qtd, geo:geo, linhas:linhas, custo:custo, venda:venda, nfPct:nfPct, vendaNF:vendaNF,
             unitario:r2(vendaNF/qtd), materiais:materiais, avisos:avisos.concat(geo.avisos||[]), params:P};
    out.grupos=agrupar(linhas);

  };
  function vinilNome(t){ return {fosco:'fosco',uv:'fosco + UV',lam:'fosco + laminação',recorte:'recorte'}[t]||t; }


  /* ═══════════ ORÇAMENTO COM VÁRIOS ITENS ═══════════

  /* avulso: linhas livres (desc, qtd, un, valor unitário; un "ml router" = valor unitário na venda, convertido a custo) */

  var GRUPOS=[['proj','Projeto / criação'],['mp','Materiais'],['gab','Gabarito de instalação'],['eqp','Equipamentos / corte'],['cons','Consumíveis'],['mo','Mão de obra'],['log','Logística'],['inst','Instalação'],['out','Outros']];

  /* ───────────── Sintético: uma linha por peça do orçamento, com qtd e valor unitário ─────────────
     A venda de cada linha = custo do bloco × fator (+NF). Projeto, logística, consumíveis e MO entram na peça. */
  function sintetico(r){
    var fatorV=r.fator*(1+r.nfPct/100), q=r.qtd, j=r.job;
    var peca=0, gab=0, inst=0, extras=0, gabRouter=0, gabMo=0;
    r.linhas.forEach(function(l){

  function descCurta(r){

      return (m?m.nome:'chapa')+(ac==='vinil'?', vinil adesivo na frente':(ac==='pintura'?', pintura PU':'')); }
    if(c==='caixa'){ var cj=j.caixa||{}, f=LCX.catalogo(cj.face||'acr3'), l=LCX.catalogo(cj.lateral||'pvc10');

  /* BDI no formato do ORC Manager / calcOrcamento: (1+ac+df+ri)/(1−lc−im) reproduz o fator do perfil.

  /* ───────────── Levantamento de materiais (lista de compras e corte) ───────────── */
  LCX.levantamento=function(r){

    });
    var itens=[];

  function novoItem(tipo, base){
    var j=jobPadrao(); j.tipo=tipo||'desenho';
    if(base){ j.cliente=base.cliente; j.projeto=base.projeto; j.perfil=base.perfil; j.perfilOv=copia(base.perfilOv||{}); j.nf=base.nf; }

  function guardar(){
    var it=st.itens[st.sel]; if(!it) return;
    it.job=st.job; it.doc=st.doc; it.buf=st.buf; it.nomeArq=st.nomeArq; it.escala=st.escala; it.larguraReal=st.larguraReal; it.camadas=st.camadas; it.printImg=st.printImg;
    if(st.r&&st.r.geo&&st.r.geo.fonte==='arquivo') it.geoSalvo=st.r.geo; else if(st.geoSalvo) it.geoSalvo=st.geoSalvo;
  }
  function abrirItem(i){
    if(i<0||i>=st.itens.length) return;
    guardar(); st.sel=i; var it=st.itens[i];
    st.job=it.job; st.doc=it.doc; st.buf=it.buf; st.nomeArq=it.nomeArq; st.escala=it.escala; st.larguraReal=it.larguraReal; st.camadas=it.camadas; st.geoSalvo=it.geoSalvo; st.printImg=it.printImg; st.r=it.r;
  }
  /* cliente, projeto, perfil/BDI e NF valem para o orçamento todo */
  function sincGlobal(){ st.itens.forEach(function(it){ if(it.job===st.job) return; var j=it.job; j.cliente=st.job.cliente; j.projeto=st.job.projeto; if(j.perfil!==st.job.perfil) j.ovr=j.ovr; j.perfil=st.job.perfil; j.perfilOv=copia(st.job.perfilOv||{}); j.nf=st.job.nf; }); }
  function carregar(){
    try{
      var j=JSON.parse(localStorage.getItem(LS_JOB)||'null');
      if(j&&j.itens&&j.itens.length){
        st.itens=j.itens.map(function(x){ var it=novoItem(); it.job=mixJob(jobPadrao(),x.job||{}); it.geoSalvo=x.geo||null; it.nomeArq=x.nomeArq||''; it.escala=x.escala||1; it.larguraReal=x.larguraReal||0; it.camadas=x.camadas||{}; return it; });
        st.sel=Math.min(j.sel||0,st.itens.length-1);
      } else if(j&&j.job){
        var it0=novoItem(); it0.job=mixJob(jobPadrao(),j.job); it0.geoSalvo=j.geo||null; it0.nomeArq=j.nomeArq||''; it0.escala=j.escala||1; it0.larguraReal=j.larguraReal||0; it0.camadas=j.camadas||{}; st.itens=[it0]; st.sel=0;
      }
    }catch(e){}
    if(!st.itens.length){ st.itens=[novoItem()]; st.sel=0; }
    var it=st.itens[st.sel];
    st.job=it.job; st.geoSalvo=it.geoSalvo; st.nomeArq=it.nomeArq; st.escala=it.escala; st.larguraReal=it.larguraReal; st.camadas=it.camadas; st.doc=it.doc; st.buf=it.buf; st.printImg=it.printImg;
    try{ st.params=JSON.parse(localStorage.getItem(LS_PAR)||'{}')||{}; }catch(e){ st.params={}; }

  function mixJob(a,b){ Object.keys(b||{}).forEach(function(k){ var v=b[k]; if(v!=null&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object') a[k]=mixJob(a[k],v); else if(v!=null) a[k]=v; }); return a; }
  function gravarLocal(){
    try{
      guardar();
      localStorage.setItem(LS_JOB, JSON.stringify({sel:st.sel, itens:st.itens.map(function(it){ return {job:it.job, geo:(it.r&&it.r.geo&&it.r.geo.fonte==='arquivo')?it.r.geo:it.geoSalvo, nomeArq:it.nomeArq, escala:it.escala, larguraReal:it.larguraReal, camadas:it.camadas}; })}));
      localStorage.setItem(LS_PAR, JSON.stringify(st.params));

  /* preços e chapas que o Carlos ajustou no Tempo de Router valem aqui também */
  function aplicarCatalogoRtr(){
    var ov={};
    try{ var c=JSON.parse(localStorage.getItem(LS_RTR)||'null'); if(c&&c.presets){ Object.keys(c.presets).forEach(function(id){ var p=c.presets[id]; if(p&&p.op==='corte') ov[id]={preco:p.preco, chapa:p.chapa}; }); } }catch(e){}
    LCX.setCatalogoOv(ov);

  /* ── desenho ── */
  function camadasAtivas(){
    if(!st.doc) return null;
    var a=[]; st.doc.camadas.forEach(function(c){ if(st.camadas[c.nome]!=='ignorar') a.push(c.nome); });
    return a;
  }
  function geoAtual(){
    var j=st.job;
    if(j.entrada==='arquivo'){
      if(st.doc) return LCX.geoDeDoc(st.doc, camadasAtivas());
      if(st.geoSalvo&&st.geoSalvo.fonte==='arquivo'){ var g=copia(st.geoSalvo); g.avisos=(g.avisos||[]).concat(['Arquivo "'+st.nomeArq+'" não está carregado nesta sessão: usando as medidas salvas. Suba de novo para refazer o encaixe de chapas.']); return g; }
      return null;
    }
    return LCX.geoDeTexto(j.texto||j.nome, j.alturaCm, j.qtdLetras);
  }
  function lerArquivo(nome, buf){
    st.ocupado=true; st.erro=null; draw();
    return motor().then(function(){
      var tp=RTR.tipoDe(nome, new Uint8Array(buf));
      var p=(tp==='pdf')?pdfjs():Promise.resolve(null);
      return p.then(function(pj){ return RTR.ler(nome, buf, pj); });
    }).then(function(doc){
      st.buf=buf; st.nomeArq=nome;
      var k=st.escala>0?st.escala:1;
      if(st.larguraReal>0){ var w=doc.bb[2]-doc.bb[0]; if(w>0) k=st.larguraReal/w; }
      st.doc=(k!==1)?RTR.escalar(doc,k):doc;
      /* camadas: anotação, gabarito, vinco e gravação não entram no contorno da peça */
      st.camadas={};
      st.doc.camadas.forEach(function(c){
        var pal=RTR.palpite(nome, c.nome), ign=(pal==='ign'||pal==='acmv'||pal==='reb'||pal==='grav'||/gabarito/i.test(c.nome));
        st.camadas[c.nome]=ign?'ignorar':'peca';
      });
      if(!st.job.nome){ st.job.nome=nome.replace(/\.[a-z0-9]{1,6}$/i,'').replace(/[_\-]+/g,' ').trim(); }
      if(st.doc.qtdSugerida&&st.job.qtd===1) st.msg='O arquivo sugere '+st.doc.qtdSugerida.n+' unidade(s) ('+st.doc.qtdSugerida.fonte+'). Confira a quantidade.';
      st.ocupado=false; recalc(); draw();
    }).catch(function(e){ st.ocupado=false; st.erro=e.message||String(e); draw(); });
  }
  function reLer(){ if(st.buf&&st.nomeArq) return lerArquivo(st.nomeArq, st.buf); return Promise.resolve(); }

  /* ── cálculo ── */
  function geoItem(it){
    var j=it.job;
    if(j.entrada==='arquivo'){
      if(it.doc){ var a=[]; it.doc.camadas.forEach(function(c){ if(it.camadas[c.nome]!=='ignorar') a.push(c.nome); }); return LCX.geoDeDoc(it.doc,a); }
      if(it.geoSalvo&&it.geoSalvo.fonte==='arquivo'){ var g=copia(it.geoSalvo); g.avisos=(g.avisos||[]).concat(['Arquivo "'+it.nomeArq+'" não está carregado nesta sessão: usando as medidas salvas. Suba de novo para refazer o encaixe de chapas.']); return g; }
      return null;
    }
    return LCX.geoDeTexto(j.texto||j.nome, j.alturaCm, j.qtdLetras);
  }
  function calcItem(it){
    var j=it.job, jc=copia(j); jc.params=copia(st.params);
    if(j.tipo==='painel'){ if(!jc.nome) jc.nome='Painel'; return LCX.calcularPainel(jc); }
    if(j.tipo==='avulso'){ if(!jc.nome) jc.nome='Item'; return LCX.calcularAvulso(jc); }
    var geo=geoItem(it); if(!geo||!(geo.pecas>0)) return null;
    jc.geo=geo; if(!jc.nome) jc.nome=geo.nome;
    return LCX.calcular(jc);
  }
  function recalc(){
    st.r=null; st.erro=st.erro&&st.ocupado?st.erro:null;
    if(!window.LCX||!window.RTR) return;
    aplicarCatalogoRtr();
    guardar();
    st.itens.forEach(function(it,i){ try{ it.r=calcItem(it); }catch(e){ it.r=null; if(i===st.sel) st.erro='Erro no cálculo: '+e.message; } });
    st.r=st.itens[st.sel].r;
    st.comb=LCX.combinar(st.itens.map(function(it){ return it.r; }));
    gravarLocal();
  }

  /* ── desenho SVG do contorno ── */
  function previewSvg(doc, ativas){
    var cts=doc.contornos.filter(function(c){ return !c.off&&ativas.indexOf(c.L)>=0; });
    if(!cts.length) return '';
    if(cts.length>3000) cts=cts.slice(0,3000);
    var bb=[Infinity,Infinity,-Infinity,-Infinity];
    cts.forEach(function(c){ if(c.bb[0]<bb[0])bb[0]=c.bb[0]; if(c.bb[1]<bb[1])bb[1]=c.bb[1]; if(c.bb[2]>bb[2])bb[2]=c.bb[2]; if(c.bb[3]>bb[3])bb[3]=c.bb[3]; });
    var w=bb[2]-bb[0], hh=bb[3]-bb[1], pad=Math.max(w,hh)*0.03+1;
    var d='';
    cts.forEach(function(c){
      var p=c.p, s='M';
      for(var i=0;i<p.length;i+=2){ s+=(i?'L':'')+(p[i]-bb[0]+pad).toFixed(2)+' '+(bb[3]-p[i+1]+pad).toFixed(2); }
      d+=s+(c.c?'Z':'');
    });
    return '<svg viewBox="0 0 '+(w+2*pad).toFixed(1)+' '+(hh+2*pad).toFixed(1)+'" style="width:100%;max-height:230px;background:#FAF8F2;border:1px solid var(--line);border-radius:8px">'
      +'<path d="'+d+'" fill="#FF5A1F" fill-opacity=".28" fill-rule="evenodd" stroke="#C2410C" stroke-width="'+(Math.max(w,hh)/700).toFixed(3)+'"/></svg>';
  }

  /* lê peso (g) e tempo (h) dos G-codes do PrusaSlicer (rodapé do arquivo); soma os arquivos = 1 unidade */
  function lerGcodes(files){
    if(!files.length) return; var tot={g:0,h:0,n:0,camada:'',bico:''}, falhas=[], pend=files.length;
    files.forEach(function(f){
      var rd=new FileReader(), ini=Math.max(0,f.size-400000);
      rd.onload=function(){
        var t=String(rd.result), g=null, h=null, m;
        m=t.match(/;\s*total filament used \[g\]\s*=\s*([\d.]+)/i); if(m) g=parseFloat(m[1]);
        if(g==null){ m=t.match(/;\s*filament used \[g\]\s*=\s*([\d.,\s]+)/i); if(m) g=m[1].split(',').reduce(function(a,x){ return a+(parseFloat(x)||0); },0); }
        m=t.match(/;\s*estimated printing time \(normal mode\)\s*=\s*([^\r\n]+)/i);
        if(m){ var d=/(\d+)d/.exec(m[1]), hh=/(\d+)h/.exec(m[1]), mm=/(\d+)m/.exec(m[1]), ss=/(\d+)s/.exec(m[1]); h=(d?+d[1]*24:0)+(hh?+hh[1]:0)+(mm?+mm[1]/60:0)+(ss?+ss[1]/3600:0); }
        var lc=t.match(/;\s*layer_height\s*=\s*([\d.]+)/i), nz=t.match(/;\s*nozzle_diameter\s*=\s*([\d.]+)/i); if(lc) tot.camada=lc[1]; if(nz) tot.bico=nz[1];
        if(g>0&&h>0){ tot.g+=g; tot.h+=h; tot.n++; } else falhas.push(f.name);
        if(--pend===0){
          if(tot.n){ st.job.i3d.peso_g=Math.round(tot.g*10)/10; st.job.i3d.tempo_h=Math.round(tot.h*100)/100; st.job.i3d.semPerda=false;
            st.gcMsg=tot.n+' G-code(s) somados: '+nf(tot.g,0)+' g · '+nf(tot.h,2)+' h'+(tot.camada?' · camada '+tot.camada+' mm':'')+(tot.bico?' · bico '+tot.bico+' mm':'')+'. A perda/falhas ('+LCX.PARAMS.p3d.perda+'%) é somada por cima; marque "Já inclui perda" se não quiser.'+(falhas.length?' Não li: '+falhas.join(', ')+' (.bgcode binário? desligue "Supports binary G-code" no PrusaSlicer).':''); recalc(); }
          else st.gcMsg='Não achei peso/tempo em: '+falhas.join(', ')+'. Se for .bgcode (binário), desligue "Supports binary G-code" na impressora do PrusaSlicer e fatie de novo.';
          draw();
        }
      };
      rd.onerror=function(){ falhas.push(f.name); if(--pend===0){ st.gcMsg='Não consegui ler os arquivos.'; draw(); } };
      rd.readAsText(f.slice(ini));
    });
  }

        var fil=null, mq=null; r.linhas.forEach(function(l){ if(l.chave==='filamento') fil=l; if(l.chave==='maq3d') mq=l; });
        if(fil&&mq){
          var fn=fil.desc.replace(/^Filamento\s+/i,''), fnome='Filamento '+fn, kgPreco=Math.round(fil.pu*1000*100)/100;
          baseAdd[fnome]={un:'kg',custo:kgPreco}; hora3d=mq.pu;
          var lf={desc:fnome+' — '+nome+' ('+Math.round(fil.qtd)+' g, já com perda)', tipo:'Matéria-prima', mp:fnome, med:Math.round(fil.qtd)+' g', qtd:Math.round(fil.qtd/10)/100, un:'kg', cobUn:(mpPor==='sulsign'?kgPreco:null)};
          (mpPor==='sulsign'?S.mpS:S.mpP).push(lf);
          S.maq.push({desc:nome+' — impressão 3D '+fn, tipo:'Impressão 3D', mp:fnome, med:r.geo.bboxMm&&r.geo.bboxMm[0]>0?Math.round(r.geo.bboxMm[0])+' × '+Math.round(r.geo.bboxMm[1])+' mm':'—', qtd:Math.round(mq.qtd*100)/100, un:'h', cobUn:mq.pu});
          S.mo.push({desc:'Fechamento de arquivo — '+nome, tipo:'Fechamento de arquivo', mp:'—', med:'—', qtd:OS_FECH_H, un:'h', cobUn:OS_FECH_VENDA});
        } else av.push('"'+nome+'": 3D sem filamento/hora calculados.');
        return;
      }
      (r.materiais||[]).forEach(function(m){
        if(m.chapa==null||m.fam==='Vinil'||!(m.m2Cobrado>0)) return;
        var bn=nomeBase(m.material), gab=(m.chave==='gab_mat');
        if(!gab&&!primeiroMat) primeiroMat=bn;
        var ln={desc:(gab?'Gabarito ':'Chapa ')+bn+' — '+nome, tipo:'Matéria-prima', mp:bn, med:m.medida||'—', qtd:Math.round(m.m2Cobrado*100)/100, un:'m²', cobUn:null};
        (mpPor==='sulsign'?S.mpS:S.mpP).push(ln);
      });
      if(it.job.tipo==='avulso') r.linhas.forEach(function(l){ if(l.grupo==='mp'&&l.un!=='m.l.'){ var ln2={desc:l.desc+' — '+nome, tipo:'Matéria-prima', mp:nomeBase(l.desc), med:'—', qtd:Math.round(l.qtd*100)/100, un:l.un, cobUn:null}; (mpPor==='sulsign'?S.mpS:S.mpP).push(ln2); if(!primeiroMat) primeiroMat=nomeBase(l.desc); } });
      var ml=0, temGab=false; r.linhas.forEach(function(l){ if(l.un==='m.l.'&&(l.chave==='router'||l.chave==='router_gab'||it.job.tipo==='avulso')){ ml+=l.qtd; if(l.chave==='router_gab') temGab=true; } });
      if(ml>0) S.maq.push({desc:nome+' — corte '+(primeiroMat||'')+(temGab?' + gabarito':''), tipo:'Corte router CNC', mp:primeiroMat||'—', med:med, qtd:Math.round(ml*10)/10, un:'m.l.', cobUn:OS_ROUTER_VENDA});
      S.mo.push({desc:'Fechamento de arquivo — '+nome, tipo:'Fechamento de arquivo', mp:'—', med:'—', qtd:OS_FECH_H, un:'h', cobUn:OS_FECH_VENDA});
    });
    var c=st.comb;
    return {versao:1, evento:(j.cliente?j.cliente+' — ':'')+(j.projeto||j.nome||''), cliente:j.cliente||'', job:'A definir (sem SS)', tipoServico:'Corte CNC (router)', setor:'Router CNC', solicitante:'PDVEX', periodo:'A confirmar',
      orcNumero:'', orcValor:c?c.vendaNF:null, mpPor:mpPor, baseAdd:baseAdd, hora3d:hora3d, perfil:(j.perfil==='pdvex'?'PDVEX':'Orçamento'), secoes:S, avisos:av, gerado:new Date().toISOString()};
  }
  function csvOSplanilha(os){
    var rows=[['Seção','Nº','Descrição','Tipo','Matéria-prima','Medidas','Qtd','Un','Cobrado unit. (R$)']], n=0;
    [['1','mpP'],['2','mpS'],['3','maq'],['4','mo']].forEach(function(s){ os.secoes[s[1]].forEach(function(l){ n++; rows.push([s[0],n,l.desc,l.tipo,l.mp,l.med,String(l.qtd).replace('.',','),l.un,l.cobUn==null?'':String(l.cobUn).replace('.',',')]); }); });
    rows.push([]); rows.push(['','','Orçamento enviado nº','','','','','',os.orcNumero]); rows.push(['','','VALOR DO ORÇAMENTO ENVIADO','','','','','',os.orcValor==null?'':String(os.orcValor).replace('.',',')]);
    return '﻿'+rows.map(function(rw){ return rw.map(function(x){ return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'; }).join(';'); }).join('\r\n');
  }
  function payloadOrc(c, numero){
    var j=st.job, grupos=[];
    function ln(l){
      var exato=Math.abs(l.qtd*l.pu-l.custo)<0.006;
      return {desc:l.desc, qtd:String(exato?Math.round(l.qtd*100)/100:1), unit:String(exato?Math.round(l.pu*10000)/10000:l.custo), un:exato?l.un:'vb', m2:false, lv:'', av:'', modified:false};
    }
    st.itens.forEach(function(it){
      var r=it.r; if(!r) return;
      var gPeca=[], gGab=[], gInst=[], gOut=[], nome=it.job.nome||r.geo.nome||'Item';
      r.linhas.forEach(function(l){
        if(l.grupo==='gab'||l.chave==='router_gab') gGab.push(ln(l)); else if(l.grupo==='inst') gInst.push(ln(l)); else if(l.grupo==='out') gOut.push(ln(l)); else gPeca.push(ln(l));
      });
      var S=r.sintetico.linhas, dim=(r.geo.bboxMm[0]>0)?Math.round(r.geo.bboxMm[0])+' × '+Math.round(r.geo.bboxMm[1])+' mm':'';
      function grp(n,linhas,sint,q){ if(linhas.length) grupos.push({nome:n, dim:dim, pecaId:null, sint:sint, sintQ:String(q), setores:[], setor:'', opcional:!!it.job.opcional, trelicaCfg:null, linhas:linhas}); }
      grp(nome, gPeca, S[0]?S[0].desc:nome, S[0]?S[0].qtd:r.qtd);
      grp('Gabarito de instalação — '+nome, gGab, 'Gabarito de instalação (MDF 3 mm, janelas no contorno) — '+nome, r.qtd);
      grp('Instalação — '+nome, gInst, 'Instalação — '+nome, 1);
      grp('Outros — '+nome, gOut, 'Outros — '+nome, 1);
    });
    return {numero:numero, cliente:j.cliente||'', agencia:'', atendimento:'', projeto:j.projeto||j.nome||'', ref:'Calculadora Letra Caixa (OS 2.0)', validade:'15 dias', bdi:c.bdiOrc, grupos:grupos,
      inclusos:[], nao_inclusos:[], condicoes:{}, estr:{descricoes:[],imagens:[]}, cronograma:[], status:'Em Orçamento', escopo:c.descTexto, rev:0, rev_historico:[], updated_at:new Date().toISOString()};
  }
  function gravarOrc(){
    var r=st.comb; if(!r) return;
    var d=new Date(), pre='SS-'+d.getFullYear()+'_'+('0'+(d.getMonth()+1)).slice(-2)+'-';
    SS20.sb('orcamentos?select=numero&numero=like.'+encodeURIComponent(pre+'*')).then(function(rows){
      var numero=LCX.proximoNumero((rows||[]).map(function(x){ return x.numero; }), d);
      var ok=confirm('Gravar este orçamento como '+numero+' em Orçamentos?\n\nItens: '+st.itens.length+'\nVenda: '+R(r.sintetico.total)+(r.nfPct>0?' (com NF)':' (sem NF)')+'\n\nDepois você abre e refina no ORC Manager.');
      if(!ok) return null;
      return SS20.sbw('orcamentos','POST',payloadOrc(r,numero)).then(function(){ SS20.cache.orc=null; st.msg='Gravado como '+numero+'. Abra em Orçamentos para ajustar e enviar.'; draw(); });
    }).catch(function(e){ st.erro='Não consegui gravar: '+e.message; draw(); });
  }

  function novo(){ if(!confirm('Começar um orçamento novo? Todos os itens atuais serão descartados.')) return; st.itens=[novoItem()]; st.sel=0; var it=st.itens[0]; st.job=it.job; st.doc=null; st.buf=null; st.nomeArq=''; st.geoSalvo=null; st.camadas={}; st.printImg=null; st.r=null; st.comb=null; st.erro=null; gravarLocal(); draw(); }

  /* ── eventos (delegados no container, uma vez) ── */
  function ligar(c){
    if(c._lcx) return; c._lcx=true;
    c.addEventListener('change', function(e){
      var el=e.target; if(!el||!c.querySelector('.lcx')) return;
      if(el.id==='lcx-file'){ var f=el.files&&el.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ lerArquivo(f.name, rd.result); }; rd.readAsArrayBuffer(f); return; }
      if(el.id==='lcx-gcode'){ lerGcodes(Array.prototype.slice.call(el.files||[])); el.value=''; return; }
      if(el.id==='lcx-print'){ var pf=el.files&&el.files[0]; if(!pf) return; var pr=new FileReader(); pr.onload=function(){ var im=new Image(); im.onload=function(){ var m=Math.min(1,1000/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=Math.round(im.width*m); cv.height=Math.round(im.height*m); var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height); st.printImg=cv.toDataURL('image/jpeg',0.85); draw(); }; im.src=pr.result; }; pr.readAsDataURL(pf); return; }
      if(el.hasAttribute('data-camada')){ st.camadas[el.getAttribute('data-camada')]=el.value; recalc(); draw(); return; }
      if(el.hasAttribute('data-ovr')){ var k=el.getAttribute('data-ovr'); st.job.ovr[k]=num(el.value); recalc(); draw(); return; }
      if(el.hasAttribute('data-par')){ var p=el.getAttribute('data-par'), v=num(el.value); if(el.value.trim()==='') delPath(st.params,p); else setPath(st.params,p,v); recalc(); draw(); return; }
      var path=el.getAttribute('data-k'); if(!path) return;
      var t=el.getAttribute('data-t'), val;
      if(t==='c') val=el.checked; else if(t==='n') val=num(el.value); else val=el.value;
      if(path==='escala'){ st.escala=num(el.value)||1; st.larguraReal=0; reLer(); return; }
      if(path==='larguraReal'){ st.larguraReal=num(el.value); reLer(); return; }
      if(path==='job.perfil') st.job.perfilOv={};
      if(path==='job.qtd') val=Math.max(1,Math.round(val)||1);
      if(path==='job.qtdLetras'&&!val) val=0;
      setPath(st,path,val);
      if(path==='job.cliente'||path==='job.projeto'||path==='job.perfil'||path==='job.nf'||path.indexOf('job.perfilOv')===0) sincGlobal();
      recalc(); draw();
    });
    c.addEventListener('click', function(e){
      var el=e.target; while(el&&el!==c&&!el.getAttribute('data-a')) el=el.parentNode;
      if(!el||el===c) return;
      var a=el.getAttribute('data-a'), v=el.getAttribute('data-v'), k=el.getAttribute('data-k');
      if(a==='entrada'){ st.job.entrada=v; recalc(); draw(); }
      else if(a==='constr'){ st.job.constr=v; recalc(); draw(); }
      else if(a==='aba'){ st.aba=v; draw(); }
      else if(a==='ovr-reset'){ delete st.job.ovr[k]; recalc(); draw(); }
      else if(a==='extra-add'){ var d=prompt('Descrição da linha (ex.: Frete, Andaime, Transporte):'); if(d){ var vv=num(prompt('Custo (R$):')||'0'); st.job.extras.push({desc:d,valor:vv}); recalc(); draw(); } }
      else if(a==='extra-del'){ var ix=parseInt(k.replace('extra',''),10); st.job.extras.splice(ix,1); delete st.job.ovr[k]; recalc(); draw(); }
      else if(a==='par-reset'){ if(confirm('Restaurar todos os padrões de preço e regras?')){ st.params={}; recalc(); draw(); } }
      else if(a==='descauto'){ st.job.descEdit=null; draw(); }
      else if(a==='copiardesc'){ var ta=document.getElementById('lcx-desc'); if(ta) st.job.descEdit=ta.value; copiar(ta?ta.value:textoDesc(st.r),'Descritivo copiado.'); }
      else if(a==='copiarsint'){ var rows=st.r.sintetico.linhas.map(function(l){ return [l.desc,l.qtd,l.un,nf(l.valorUn,2),nf(l.total,2)].join('\t'); }); copiar(rows.join('\n'),'Sintético copiado (colunas separadas por tabulação).'); }
      else if(a==='csvos'){ baixar('OS_linhas_'+slug(st.job.nome||st.r.geo.nome)+'.csv','text/csv;charset=utf-8',csvOS([st.itens[st.sel]])); }
      else if(a==='csv'){ baixar('levantamento_'+slug(st.job.nome||st.r.geo.nome)+'.csv','text/csv;charset=utf-8',csvLev(st.r)); }
      else if(a==='proposta'){ baixar('proposta_'+slug(st.job.nome||st.r.geo.nome)+'.html','text/html;charset=utf-8',propostaHtml(st.r,'')); }
      else if(a==='json'){ var o=copia(st.r); delete o.job.geo; baixar('calculo_'+slug(st.job.nome||st.r.geo.nome)+'.json','application/json',JSON.stringify(o,null,1)); }
      else if(a==='print-del'){ st.printImg=null; draw(); }
      else if(a==='item-sel'){ abrirItem(parseInt(v,10)); recalc(); draw(); }
      else if(a==='item-add'){ guardar(); var ni=novoItem(v,st.job); st.itens.push(ni); st.sel=st.itens.length-2; abrirItem(st.itens.length-1); recalc(); draw(); window.scrollTo(0,0); }
      else if(a==='item-dup'){ guardar(); var di=novoItem(st.job.tipo,st.job); di.job=copia(st.job); di.job.nome=(st.job.nome||'Item')+' (cópia)'; di.job.ovr={}; di.doc=st.doc; di.buf=st.buf; di.nomeArq=st.nomeArq; di.escala=st.escala; di.larguraReal=st.larguraReal; di.camadas=copia(st.camadas); di.geoSalvo=st.geoSalvo; di.printImg=st.printImg; st.itens.splice(st.sel+1,0,di); abrirItem(st.sel+1); recalc(); draw(); }
      else if(a==='item-del'){ if(st.itens.length<2){ st.msg='O orçamento precisa ter ao menos um item.'; draw(); } else if(confirm('Remover o item "'+(st.job.nome||'sem nome')+'"?')){ var k0=st.sel; st.itens.splice(k0,1); st.sel=Math.min(k0,st.itens.length-1); var it2=st.itens[st.sel]; st.job=it2.job; st.doc=it2.doc; st.buf=it2.buf; st.nomeArq=it2.nomeArq; st.escala=it2.escala; st.larguraReal=it2.larguraReal; st.camadas=it2.camadas; st.geoSalvo=it2.geoSalvo; st.printImg=it2.printImg; recalc(); draw(); } }
      else if(a==='item-up'||a==='item-down'){ guardar(); var d0=a==='item-up'?-1:1, t0=st.sel+d0; if(t0>=0&&t0<st.itens.length){ var tmp=st.itens[st.sel]; st.itens[st.sel]=st.itens[t0]; st.itens[t0]=tmp; st.sel=t0; recalc(); draw(); } }
      else if(a==='avulso-add'){ st.job.avulso.linhas.push({desc:'',qtd:1,un:'un',pu:0,grupo:'mp'}); recalc(); draw(); }
      else if(a==='avulso-del'){ st.job.avulso.linhas.splice(parseInt(k,10),1); if(!st.job.avulso.linhas.length) st.job.avulso.linhas.push({desc:'',qtd:1,un:'un',pu:0,grupo:'mp'}); recalc(); draw(); }
      else if(a==='csvlevall'){ if(st.comb) baixar('levantamento_'+slug(st.job.projeto||st.job.cliente||'orcamento')+'.csv','text/csv;charset=utf-8',csvLev(st.comb)); }
      else if(a==='osjson'){ var mp=(document.getElementById('lcx-mppor')||{}).value||'pdvex'; var os=montarOS(st.itens,mp), bn=slug(st.job.projeto||st.job.cliente||'orcamento'); baixar('OS_'+bn+'.json','application/json',JSON.stringify(os,null,1)); baixar('OS_'+bn+'_linhas.csv','text/csv;charset=utf-8',csvOSplanilha(os)); st.msg='OS gerada. '+(os.avisos.join(' ')||'')+' Mande o .json que eu gravo a aba na planilha.'; draw(); }
      else if(a==='csvosall'){ if(st.comb) baixar('OS_linhas_'+slug(st.job.projeto||st.job.cliente||'orcamento')+'.csv','text/csv;charset=utf-8',csvOS(st.itens)); }
      else if(a==='propostaall'){ if(st.comb) baixar('proposta_'+slug(st.job.projeto||st.job.cliente||'orcamento')+'.html','text/html;charset=utf-8',propostaHtml(st.comb,'')); }
      else if(a==='bdi-reset'){ st.job.perfilOv={}; sincGlobal(); recalc(); draw(); }
      else if(a==='orcfile'){ if(window.LCX_EXPORT_ORC) window.LCX_EXPORT_ORC(st.r, st); }
      else if(a==='orc'){ gravarOrc(); }
      else if(a==='novo'){ novo(); }
    });
    c.addEventListener('input', function(e){
      var el=e.target; if(el&&el.id==='lcx-desc'){ st.job.descEdit=el.value; gravarLocal(); }
    });
  }

  function render(c){
    st.root=c; estilo(); ligar(c);
    c.innerHTML='<div class="loading-view">Carregando motor…</div>';
    if(!st.job) carregar();
    motor().then(function(){ recalc(); draw(); }).catch(function(e){ c.innerHTML='<div class="err-view">'+esc(e.message)+'</div>'; });
  }

  SS20.modules.lcx={render:render};
})();
</script>
<script>SS20.modules.lcx.render(document.getElementById('ss-content'));</script>
